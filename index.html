<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roman Pāli to Shan Pāli Converter</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:16px;line-height:1.5}
h1{font-size:1.5rem} .muted{opacity:.75;font-size:.94rem}
label{display:block;font-weight:650;margin:14px 0 6px}
textarea{width:100%;min-height:140px;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #8888;font:1rem/1.5 system-ui,sans-serif}
#output{min-height:150px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:650;background:#287a61;color:white}
.secondary{background:#777}.note{border-left:4px solid #287a61;padding:10px 12px;margin:14px 0}
</style>
</head>
<body>
<h1>Roman Pāli → Shan Pāli Converter</h1>
<p class="muted">A first version based on the spelling rules you taught me.</p>
<label for="input">Roman Pāli input</label>
<textarea id="input" spellcheck="false" placeholder="Type Roman Pāli here..."></textarea>
<div class="buttons">
<button id="convert">Convert</button><button id="sample" class="secondary">Load corrected sample</button>
<button id="clear" class="secondary">Clear</button><button id="copy" class="secondary">Copy result</button>
</div>
<label for="output">Shan Pāli result</label>
<textarea id="output" readonly spellcheck="false" placeholder="Shan Pāli will appear here..."></textarea>
<p id="status" class="muted" aria-live="polite"></p>
<div class="note"><strong>Note:</strong> This is a starter converter. Some complex clusters and special-mark positions still need more examples to make every word accurate.</div>
<script>
"use strict";

// Roman consonants are matched longest-first, so kh is not mistaken for k+h.
const consonants = [
 ["ṭh","ꩧ"],["ḍh","ꩩ"],["kh","ၶ"],["gh","ꧠ"],["ch","ꧡ"],["jh","ꧢ"],
 ["ṅ","င"],["ñ","ၺ"],["ṭ","ꩦ"],["ḍ","ꩨ"],["ṇ","ꧣ"],["th","ထ"],["dh","ꩪ"],
 ["ph","ၽ"],["bh","ꧤ"],["ḷ","ꩮ"],["k","ၵ"],["g","ၷ"],["c","ၸ"],["j","ꩡ"],
 ["t","တ"],["d","ၻ"],["n","ၼ"],["p","ပ"],["b","ၿ"],["m","မ"],["y","ယ"],
 ["r","ရ"],["l","လ"],["w","ဝ"],["v","ဝ"],["s","သ"],["h","ႁ"]
];
const independent = {
 "aṃ":"ဢံ","iṃ":"ဢိံ","uṃ":"ဢုံ",
 "a":"ဢ","ā":"ဢႃ","i":"ဢိ","ī":"ဢီ","u":"ဢု","ū":"ဢူ","e":"ဢေ","o":"ဢေႃ"
};
const signs = {"a":"","ā":"ႃ","i":"ိ","ī":"ီ","u":"ု","ū":"ူ","e":"ေ","o":"ေႃ"};

// Exact reference spellings supplied by you for this sample paragraph.
const references = {
 "tena":"တေၼ",
 "samayena":"သမယေၼ",
 "buddho":"ၿုၻ်ꩪေႃ",
 "bhagavā":"ꧤၷဝႃ",
 "verañjāyaṃ":"ဝေရၺ်ၸႃယံ",
 "viharati":"ဝိႁရတိ",
 "naḷerupuccimandamūle":"ၼꩮေရုပုၸိမၼ်ၻမူလေ",
 "mahatā":"မႁတႃ",
 "bhikkhusaṅghena":"ꧤိၵ်ၶုသံꧠေၼ",
 "saddhiṃ":"သၻ်ꩪိံ",
 "pañcamattēhi":"ပၺ်ၸမတ်တေႁိ",
 "bhikkhusatehi":"ꧤိၵ်ၶုသတေႁိ"
};
const romanSample = "Tena samayena buddho bhagavā verañjāyaṃ viharati naḷerupuccimandamūle mahatā bhikkhusaṅghena saddhiṃ pañcamattēhi bhikkhusatehi.";
const shanSample = "တေၼ သမယေၼ ၿုၻ်ꩪေႃ ꧤၷဝႃ ဝေရၺ်ၸႃယံ ဝိႁရတိ ၼꩮေရုပုၸိမၼ်ၻမူလေ မႁတႃ ꧤိၵ်ၶုသံꧠေၼ သၻ်ꩪိံ ပၺ်ၸမတ်တေႁိ ꧤိၵ်ၶုသတေႁိ။";

function normalize(s){return s.normalize("NFC").toLowerCase().replace(/[’‘]/g,"'");}
function matchConsonant(s,i){for(const [r,out] of consonants){if(s.startsWith(r,i))return {r,out};}return null;}
function convertWord(raw){
 const s=normalize(raw);
 if(references[s]) return references[s];
 let out="",i=0;
 while(i<s.length){
   let independentMatch=null;
   for(const v of ["aṃ","iṃ","uṃ","ā","ī","ū","a","i","u","e","o"]){
     if(s.startsWith(v,i)){independentMatch=v;break;}
   }
   const c=matchConsonant(s,i);
   if(!c && independentMatch){out+=independent[independentMatch];i+=independentMatch.length;continue;}
   if(c){
     const after=i+c.r.length, next=matchConsonant(s,after);
     if(next && next.r===c.r){
       out+=c.out+"်"+next.out;i=after+next.r.length;
       const v=["ā","ī","ū","a","i","u","e","o"].find(x=>s.startsWith(x,i));
       if(v){out+=signs[v];i+=v.length;}
       continue;
     }
     out+=c.out;i=after;
     if(s.startsWith("r",i)){out+="ြ";i++;}
     else if(s.startsWith("v",i)||s.startsWith("w",i)){out+="ွ";i++;}
     else if(s.startsWith("y",i)){out+="ျ";i++;}
     const v=["ā","ī","ū","a","i","u","e","o"].find(x=>s.startsWith(x,i));
     if(v){out+=signs[v];i+=v.length;}
     continue;
   }
   if(s.startsWith("ṃ",i)){out+="ံ";i++;continue;}
   const ch=raw[i]??s[i];
   if(ch===".")out+="။";else if(ch===",")out+="၊";else out+=ch;
   i++;
 }
 return out;
}
function convertText(text){
 return text.replace(/[A-Za-zāīūṅñṭḍṇḷṃĀĪŪṄÑṬḌṆḶ]+|[.,]/g, token => {
   if(token===".") return "။";
   if(token===",") return "၊";
   return convertWord(token);
 });
}
const input=document.getElementById("input"), output=document.getElementById("output"), status=document.getElementById("status");
document.getElementById("convert").onclick=()=>{output.value=convertText(input.value);status.textContent="Converted. Please check complex clusters against your reference spellings.";};
document.getElementById("sample").onclick=()=>{input.value=romanSample;output.value=shanSample;status.textContent="Loaded the Roman sample and your corrected Shan Pāli reference.";};
document.getElementById("clear").onclick=()=>{input.value="";output.value="";status.textContent="";};
document.getElementById("copy").onclick=async()=>{if(!output.value){status.textContent="Nothing to copy yet.";return;}try{await navigator.clipboard.writeText(output.value);status.textContent="Copied!";}catch(e){output.focus();output.select();status.textContent="Select the result and choose Copy.";}}
</script>
</body>
</html>
